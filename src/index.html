<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskTracker - Minimal Task Management</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
    h1 { color: #2c3e50; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; }
    ul { list-style-type: none; padding: 0; }
    li { padding: 8px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div class="card">
    <h1>TaskTracker</h1>
    <p>Welcome! Your local development setup is working perfectly.</p>
    <h3>My Tasks</h3>
    <ul>
      <li><input type="checkbox" checked> Complete CS Assignment</li>
      <li><input type="checkbox"> Set up Docker container</li>
      <li><input type="checkbox"> Submit GitHub link</li>
    </ul>
  </div>
</body>
</html>
